<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopyDownload Staff Dashboard</title><style>:root{--ink:#102a43;--teal:#0f766e;--bg:#f7f9f7;--muted:#64748b;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:var(--bg);color:var(--ink)}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--ink);color:#fff;padding:26px 16px;flex-shrink:0}.brand{font-size:21px;font-weight:800;padding:0 10px}.sub{font-size:12px;color:#b8c5d2;padding:7px 10px 27px}.nav a{display:flex;gap:12px;color:#cbd5e1;text-decoration:none;padding:13px 12px;border-radius:11px;margin:4px 0}.nav a.active,.nav a:hover{background:#fff;color:var(--ink)}.count{margin-left:auto;background:#fbbf24;color:var(--ink);font-size:10px;padding:3px 7px;border-radius:20px}.main{flex:1;min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.content{max-width:1200px;margin:auto;padding:34px 38px}.eyebrow{color:var(--teal);font-size:12px;font-weight:bold}.title{font-size:30px;margin:8px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #102a430b}.card{padding:18px}.num{font-size:29px;font-weight:800;margin:8px 0}.dash{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:22px}.panel{overflow:hidden}.head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #eef0f2}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #eef0f2}.row:last-child{border-bottom:0}.name{font-weight:bold}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{font-size:11px;font-weight:bold;border-radius:20px;padding:6px 10px;background:#ecfdf5;color:#047857}.wait{background:#fffbeb;color:#b45309}.bad{background:#fff1f2;color:#be123c}.approval{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:18px}.message{background:#fff;border-radius:11px;padding:14px;line-height:1.6;margin:15px 0}.btn{background:var(--teal);border:0;color:#fff;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.reject{color:#be123c;background:#fff;border:1px solid #fecdd3;border-radius:10px;padding:9px 14px;font-weight:bold;margin-right:7px}.tools{display:flex;gap:10px;padding:16px;border-bottom:1px solid var(--line)}input,select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}input{flex:1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th{text-align:left;background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;padding:13px 16px}.table td{padding:14px 16px;border-top:1px solid #eef0f2}.activity{padding:18px}.activity p{margin:14px 0 5px}.hide{display:none}.hero{background:linear-gradient(130deg,#102a43,#145e69);border-radius:20px;color:white;padding:28px;margin-bottom:22px}.hero h1{font-size:35px;max-width:600px;margin:12px 0}.hero p{color:#c9e5e6;line-height:1.7;max-width:650px}.agent{display:inline-flex;align-items:center;gap:8px;background:#ffffff18;border:1px solid #ffffff2d;border-radius:10px;padding:9px 11px;margin:4px;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.dash{grid-template-columns:1fr}}@media(max-width:620px){.side{width:70px;padding:20px 8px}.brand,.sub,.nav span{display:none}.nav a{justify-content:center}.content{padding:24px 15px}.top{padding:0 15px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:27px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">CopyDownload</div><div class="sub">Staff workspace</div><nav class="nav"><a href="#dashboard" data-page="dashboard" class="active">◉ <span>Dashboard</span></a><a href="#students" data-page="students">♙ <span>Students</span></a><a href="#universities" data-page="universities">▣ <span>Universities</span></a><a href="#documents" data-page="documents">✓ <span>Documents</span></a><a href="#approvals" data-page="approvals">◈ <span>Approvals</span><i class="count">1</i></a><a href="#activity" data-page="activity">☷ <span>Activity</span></a></nav></aside><main class="main"><header class="top"><span class="muted">Nowshera Study Abroad Consultants</span><b>NS &nbsp; Nowshera Staff</b></header><section id="app" class="content"></section></main></div><script>
const students=[['Ali Khan','0301 2345678','UK','78%','6.5','£35,000','active','Today'],['Ayesha Noor','0333 9876543','Canada','85%','7.0','CAD 65,000','active','Today'],['Hamza Iqbal','0346 2223344','UK','69%','Not taken','£25,000','waiting','4 days ago']];
const universities=[['University of Manchester','UK','BSc Computer Science','£32,000/year','15 Jan 2027','75%','6.5'],['University of Leeds','UK','BSc Business Management','£27,000/year','31 Jan 2027','70%','6.5'],['University of Toronto','Canada','BSc Computer Science','CAD 60,000/year','15 Jan 2027','80%','6.5'],['TU Munich','Germany','BSc Informatics','No tuition (about €150 a term)','15 Jul 2027','70%','6.5'],['Monash University','Australia','Bachelor of IT','AUD 48,000/year','30 Nov 2026','70%','6.0'],['University of Birmingham','UK','BSc Data Science','£29,000/year','25 Jan 2027','72%','6.5'],['UBC','Canada','BSc Information Technology','CAD 55,000/year','15 Jan 2027','78%','6.5'],['University of Melbourne','Australia','Bachelor of Commerce','AUD 45,000/year','31 Oct 2026','75%','6.5']];
function badge(s){return `<span class="pill ${s==='waiting'||s==='pending'?'wait':''} ${s==='problem'||s==='rejected'?'bad':''}">${s}</span>`}function table(headers,rows){return `<div class="panel tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function dashboard(){return `<div class="hero"><div class="eyebrow" style="color:#8ce9dc">AGENTIC OFFICE CONTROL ROOM</div><h1>Your study abroad office, always awake.</h1><p>AI teammates welcome students, find suitable programs, check documents and prepare follow-ups — while staff stay in control of every message.</p><div><span class="agent">💬 Welcome Agent · online</span><span class="agent">🧠 University Scout · online</span><span class="agent">✓ Document Guard · online</span><span class="agent">⚡ Follow-up Pilot · watching</span></div></div><div class="grid"><div class="card"><div class="muted">Total Students</div><div class="num">3</div><small class="muted">All active records</small></div><div class="card"><div class="muted">Pending Approvals</div><div class="num">1</div><small class="muted">Needs staff action</small></div><div class="card"><div class="muted">Documents to Review</div><div class="num">2</div><small class="muted">Pending or problem</small></div><div class="card"><div class="muted">Follow-ups Needed</div><div class="num">1</div><small class="muted">Hamza · 4 days ago</small></div></div><div class="dash"><section class="panel"><div class="head"><div><b>Recent students</b><div class="muted" style="font-size:12px;margin-top:5px">Latest profiles in your pipeline</div></div><a href="#students" style="color:#0f766e;font-weight:bold">View all</a></div>${students.map(s=>`<div class="row"><div><div class="name">${s[0]}</div><div class="meta">${s[2]} · ${s[3]} marks · IELTS ${s[4]}</div></div>${badge(s[6])}</div>`).join('')}</section><div><section class="approval"><b>Approval radar</b><div class="muted" style="font-size:12px;margin-top:5px">No AI message leaves without a human.</div><div class="message"><b>Hamza Iqbal</b><br><span class="muted">Assalam-o-alaikum Hamza, aap ka follow-up due hai. Kya aap apne IELTS test ki date confirm kar sakte hain?</span></div><button class="reject" onclick="alert('Reject API prepared')">Reject</button><button class="btn" onclick="alert('Approve API prepared')">Approve</button></section><section class="panel activity" style="margin-top:20px"><b>Recent activity</b><p>New transcript uploaded for Ayesha Noor</p><small class="muted">18 min ago</small><p>Hamza follow-up waiting for approval</p><small class="muted">1 hr ago</small></section></div></div>`}
function studentsPage(){return `<div class="eyebrow">STUDENT PIPELINE</div><h1 class="title">Students</h1><p class="muted">Manage student profiles and follow-up status.</p><div class="panel"><div class="tools"><input id="studentSearch" placeholder="Search by name or country"><select id="status"><option>All statuses</option><option>active</option><option>waiting</option></select></div><div id="studentTable"></div></div>`}function renderStudents(){const q=(document.getElementById('studentSearch')?.value||'').toLowerCase(),st=document.getElementById('status')?.value||'All statuses';const rows=students.filter(s=>(s[0]+s[2]).toLowerCase().includes(q)&&(st==='All statuses'||s[6]===st)).map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${s[5]}</td><td>${badge(s[6])}</td><td>${s[7]}</td></tr>`);document.getElementById('studentTable').innerHTML=table(['Name','Phone','Country','Marks','IELTS','Budget','Status','Last reply'],rows)}
function universitiesPage(){return `<div class="eyebrow">SHORTLIST LIBRARY</div><h1 class="title">University Programs</h1><p class="muted">Office-approved practice programs for student matching.</p><div class="panel"><div class="tools"><input id="uniSearch" placeholder="Search universities or programs"><select id="country"><option>All countries</option><option>UK</option><option>Canada</option><option>Germany</option><option>Australia</option></select></div><div id="uniTable"></div></div>`}function renderUniversities(){const q=(document.getElementById('uniSearch')?.value||'').toLowerCase(),c=document.getElementById('country')?.value||'All countries';const rows=universities.filter(u=>(u[0]+u[2]).toLowerCase().includes(q)&&(c==='All countries'||u[1]===c)).map(u=>`<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td>${u[2]}</td><td>${u[3]}</td><td>${u[4]}</td><td>${u[5]}</td><td>${u[6]}</td><td>Passport, transcript, IELTS</td></tr>`);document.getElementById('uniTable').innerHTML=table(['University','Country','Program','Fee','Deadline','Min marks','Min IELTS','Documents'],rows)}
function documents(){return `<div class="eyebrow">COMPLIANCE DESK</div><h1 class="title">Documents</h1><p class="muted">Review fake test documents before they move forward.</p>${table(['Student','Document type','Status','Issue','Uploaded'],['<tr><td><b>Ali Khan</b></td><td>Passport (test)</td><td>'+badge('approved')+'</td><td>—</td><td>28 Sep 2026</td></tr>','<tr><td><b>Ayesha Noor</b></td><td>Transcript (test)</td><td>'+badge('pending')+'</td><td>Awaiting staff review</td><td>27 Sep 2026</td></tr>','<tr><td><b>Hamza Iqbal</b></td><td>IELTS result (test)</td><td>'+badge('problem')+'</td><td>IELTS not taken yet</td><td>24 Sep 2026</td></tr>'])}`}
function approvals(){return `<div class="eyebrow">HUMAN-IN-THE-LOOP</div><h1 class="title">Approvals</h1><p class="muted">AI messages never send automatically. Staff review comes first.</p><div class="approval" style="max-width:760px;margin-top:22px"><div style="display:flex;justify-content:space-between"><b>Hamza Iqbal</b>${badge('pending')}</div><div class="muted" style="font-size:12px;margin-top:5px">AI generated · 4 days ago</div><div class="message">Assalam-o-alaikum Hamza, aap ka follow-up due hai. Kya aap apne IELTS test ki date confirm kar sakte hain?</div><button class="reject" onclick="alert('Reject webhook ready in Next.js API layer')">Reject</button><button class="btn" onclick="alert('Approve webhook ready in Next.js API layer')">Approve</button></div>`}function activity(){return `<div class="eyebrow">COMMUNICATION LOG</div><h1 class="title">Activity & Messages</h1><p class="muted">Audit trail for student, AI and staff messages.</p>${table(['Student','Sender','Message','Approval status','Created'],['<tr><td><b>Hamza Iqbal</b></td><td>AI</td><td>Follow-up due. Please confirm your IELTS date.</td><td>'+badge('pending')+'</td><td>4 days ago</td></tr>','<tr><td><b>Ali Khan</b></td><td>Staff</td><td>Your Manchester shortlist is ready.</td><td>'+badge('approved')+'</td><td>Yesterday</td></tr>','<tr><td><b>Ayesha Noor</b></td><td>AI</td><td>We found three Canadian programs.</td><td>'+badge('sent')+'</td><td>Yesterday</td></tr>'])}`}
function go(){const page=location.hash.slice(1)||'dashboard';document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));const app=document.getElementById('app');app.innerHTML=page==='dashboard'?dashboard():page==='students'?studentsPage():page==='universities'?universitiesPage():page==='documents'?documents():page==='approvals'?approvals():activity();if(page==='students'){renderStudents();studentSearch.oninput=renderStudents;status.onchange=renderStudents}if(page==='universities'){renderUniversities();uniSearch.oninput=renderUniversities;country.onchange=renderUniversities}}addEventListener('hashchange',go);go();</script></body></html>
